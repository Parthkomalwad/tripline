name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...
      - name: Build static binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w" -o bin/tripline-linux-amd64 ./cmd/tripline
      - name: Check binary is static
        run: file bin/tripline-linux-amd64 | grep -q "statically linked"
      - name: Build image
        run: docker build -t tripline:ci .
      - name: Check image runs as non-root on a read-only filesystem
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' tripline:ci)" = "65532:65532"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges tripline:ci version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tripline-linux-amd64
          path: bin/tripline-linux-amd64
          retention-days: 7

  sign:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tripline-linux-amd64
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign test artifact (keyless)
        run: cosign sign-blob --yes --bundle tripline-linux-amd64.sigstore.json tripline-linux-amd64
      - name: Verify signature against this workflow identity
        run: |
          cosign verify-blob tripline-linux-amd64 \
            --bundle tripline-linux-amd64.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
