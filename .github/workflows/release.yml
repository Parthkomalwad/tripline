name: release

# Runs only when a maintainer pushes a version tag. The `release` job waits for
# approval from a reviewer in the `release` environment (repository settings).
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...
      - name: Build release binaries and SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/build-release.sh "$TAG" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify SHA256SUMS
        run: cd dist && sha256sum --check SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign each binary (keyless)
        run: |
          for f in dist/tripline-*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Generate one SBOM per binary
        run: |
          for f in dist/tripline-*; do
            go run ./internal/tools/sbom -version "$TAG" "$f" > "$f.spdx.json"
          done
      - name: Attest build provenance for the binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Build and push the image
        id: image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tripline"
          mkdir -p bin
          cp dist/tripline-linux-amd64 bin/tripline-linux-amd64
          docker build -t "$image:$TAG" .
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$TAG"
          ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$TAG")
          digest=${ref#*@}
          case "$digest" in sha256:*) ;; *) echo "bad digest: $digest" >&2; exit 1 ;; esac
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign the image by digest (keyless)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest build provenance for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cat > notes.md <<EOF
          Image (deploy by digest, never by tag):

          \`$IMAGE@$DIGEST\`

          Verify the binaries and the image as described in docs/release.md.
          Wait 3 days before you adopt this release, unless it is a security fix.
          EOF
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            dist/tripline-* dist/SHA256SUMS
